name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated spec files to run instead of the full suite"
        required: false
        default: ""

jobs:
  Test:
    strategy:
      fail-fast: false
      matrix:
        # Upstream's matrix was ['lts/*', 'node'], which on 2021-05-27 resolved to
        # Node 14 and Node 16. Pinned to those so the legs stay reproducible.
        # Node 8 cannot run this suite: the locked jasmine 3.7.0 ships
        # lib/loader.js with a dynamic import(), a syntax error before Node 12.
        node_version: ['14', '16']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Pin npm registry to the release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2021-05-27T16:17:12.429000Z
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        if: inputs.test-filter == ''
        run: npm run test:unit
      - name: Run Spec Tests 👩🏽‍💻
        if: inputs.test-filter == ''
        run: npm run test:specs
      - name: Run Selected Tests 👩🏽‍💻
        if: inputs.test-filter != ''
        run: npm test -- ${{ inputs.test-filter }}

  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 14.17.0
      - name: Pin npm registry to the release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2021-05-27T16:17:12.429000Z
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        run: npm run build
      - name: Use the npm that packed the public tarball
        run: npm i -g npm@7.12.0
      - name: Pack 📦
        run: npm pack
      - name: Upload Package Tarball
        uses: actions/upload-artifact@v4
        with:
          name: marked-2.0.6-tgz
          path: marked-2.0.6.tgz
          if-no-files-found: error
